<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zomerplaylists — doorzoekbaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b30;
    --ink-soft:#5b6b70;
    --paper:#f1ece2;
    --card:#faf7f1;
    --line:#ddd4c5;
    --line-soft:#e7dfd2;
    --marine:#1f5c6b;
    --amber:#e4933b;
    --hl:#fff3d6;
    --focus:#1f5c6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

  header.masthead{
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    gap:16px 24px;padding-bottom:18px;border-bottom:2px solid var(--ink);
  }
  .title-block h1{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;font-size:clamp(28px,5vw,44px);
    letter-spacing:-.02em;margin:0;line-height:1;
  }
  .title-block p{
    margin:8px 0 0;color:var(--ink-soft);max-width:52ch;font-size:14px;
  }
  .stat{
    font-family:"Space Mono",monospace;
    text-align:right;line-height:1.2;white-space:nowrap;
  }
  .stat .big{font-size:30px;font-weight:700;color:var(--marine)}
  .stat .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

  .controls{
    position:sticky;top:0;z-index:30;background:var(--paper);
    padding:16px 0 12px;margin-top:4px;
  }
  .searchrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .field{position:relative;flex:1 1 260px;min-width:0}
  .field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  #global{
    width:100%;padding:12px 14px 12px 38px;
    font-family:"Space Grotesk",sans-serif;font-size:16px;
    background:var(--card);color:var(--ink);
    border:1.5px solid var(--line);border-radius:10px;
  }
  #global::placeholder{color:#9aa5a0}
  #global:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(31,92,107,.15)}
  .clearbtn{
    font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;cursor:pointer;
    background:transparent;border:1.5px solid var(--line);border-radius:10px;
    color:var(--ink-soft);padding:11px 14px;white-space:nowrap;
  }
  .clearbtn:hover{border-color:var(--ink);color:var(--ink)}
  .clearbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .tablecard{
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    overflow:hidden;margin-top:14px;
  }
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  thead th{
    position:sticky;top:0;background:var(--card);z-index:5;
    text-align:left;padding:0;border-bottom:1.5px solid var(--ink);
  }
  .th-inner{
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:14px 14px 8px;
    font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  }
  .th-inner:hover{color:var(--marine)}
  .th-inner .arrow{font-family:"Space Mono",monospace;font-size:12px;color:var(--marine);opacity:0;transition:opacity .12s}
  th.sorted .th-inner .arrow{opacity:1}
  .th-filterwrap{padding:0 10px 12px}
  .colfilter{
    width:100%;padding:7px 10px;font-size:13px;font-family:"Inter",sans-serif;
    background:var(--paper);color:var(--ink);
    border:1.5px solid var(--line-soft);border-radius:7px;
  }
  .colfilter::placeholder{color:#a7b0ab;font-style:italic}
  .colfilter:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px rgba(31,92,107,.15)}

  tbody td{padding:9px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#f2ede3}
  .col-num{width:52px;font-family:"Space Mono",monospace;font-size:12px;color:var(--ink-soft);text-align:right;padding-right:16px}
  .t-title{font-weight:500;color:var(--ink)}
  .t-artist{color:var(--ink-soft)}
  .chip{
    display:inline-block;padding:3px 9px;border-radius:999px;
    font-family:"Space Mono",monospace;font-size:11.5px;font-weight:700;
    color:#fff;white-space:nowrap;letter-spacing:.01em;
  }
  a.chip{text-decoration:none;cursor:pointer;transition:transform .1s,box-shadow .1s,filter .1s}
  a.chip:hover{filter:brightness(1.06);box-shadow:0 2px 9px rgba(0,0,0,.2);transform:translateY(-1px)}
  a.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  a.tlink{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:color .1s,border-color .1s}
  a.tlink:hover{color:var(--marine);border-bottom-color:rgba(31,92,107,.4)}
  a.tlink:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
  .play{display:inline-block;margin-left:7px;font-size:9px;color:var(--marine);opacity:0;transform:translateX(-3px);transition:opacity .12s,transform .12s;vertical-align:middle}
  a.tlink:hover .play,a.tlink:focus-visible .play{opacity:1;transform:translateX(0)}
  mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}

  .empty{padding:48px 20px;text-align:center;color:var(--ink-soft)}
  .empty strong{display:block;font-family:"Space Grotesk",sans-serif;color:var(--ink);font-size:17px;margin-bottom:4px}

  footer{margin-top:22px;font-size:12px;color:var(--ink-soft);font-family:"Space Mono",monospace;letter-spacing:.03em}

  @media (max-width:560px){
    .col-num{display:none}
    tbody td,.th-inner,.th-filterwrap{padding-left:12px;padding-right:12px}
    body{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    </div>
  </div>

            <th><div class="th-inner" data-key="t">Titel <span class="arrow"></span></div>
                <div class="th-filterwrap"><input class="colfilter" data-col="t" type="search" placeholder="filter titel" autocomplete="off"></div></th>
            <th><div class="th-inner" data-key="a">Artiest <span class="arrow"></span></div>
                <div class="th-filterwrap"><input class="colfilter" data-col="a" type="search" placeholder="filter artiest" autocomplete="off"></div></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>
      <strong>Geen nummers gevonden</strong>
      Pas je zoekterm of filters aan.
    </div>
  </div>

  <footer id="foot"></footer>
</div>

const DATA = RAW.map((r,i)=>({
  id:i,
  p:PLAYLISTS[r[0]].name,
  color:PLAYLISTS[r[0]].color,
  pid:PLAYLISTS[r[0]].id,
  t:r[1],
  a:r[2],
  tid:TIDS[i]
}));

const TOTAL = DATA.length;
document.getElementById("count").textContent = TOTAL;
document.querySelector(".stat .lbl").textContent = "van "+TOTAL+" nummers";

const norm = s => s.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

// precompute normalized fields
DATA.forEach(d=>{ d._p=norm(d.p); d._t=norm(d.t); d._a=norm(d.a); d._all=d._p+" "+d._t+" "+d._a; });

const state = { q:"", f:{p:"",t:"",a:""}, sort:"n", dir:1 };

const rowsEl = document.getElementById("rows");
const emptyEl = document.getElementById("empty");
const footEl = document.getElementById("foot");

function highlight(text, term){
  if(!term) return escapeHtml(text);
  const nt = norm(text), nq = norm(term);
  let out="", i=0;
  while(true){
    const idx = nt.indexOf(nq, i);
    if(idx===-1){ out+=escapeHtml(text.slice(i)); break; }
    out+=escapeHtml(text.slice(i,idx));
    out+="<mark>"+escapeHtml(text.slice(idx, idx+term.length))+"</mark>";
    i = idx+term.length;
  }
  return out;
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function currentTerm(col){
  // per-column filter takes precedence for highlighting; else global
  return state.f[col] || state.q;
}

function apply(){
  const q = norm(state.q);
  const fp = norm(state.f.p), ft = norm(state.f.t), fa = norm(state.f.a);

  let list = DATA.filter(d=>{
    if(q && !d._all.includes(q)) return false;
    if(fp && !d._p.includes(fp)) return false;
    if(ft && !d._t.includes(ft)) return false;
    if(fa && !d._a.includes(fa)) return false;
    return true;
  });

  const s = state.sort, dir = state.dir;
  if(s!=="n"){
    list = list.slice().sort((a,b)=>{
      const av=a["_"+s], bv=b["_"+s];
      if(av<bv) return -1*dir;
      if(av>bv) return 1*dir;
      return a.id-b.id;
    });
  } else if(dir===-1){
    list = list.slice().reverse();
  }

  render(list);
}

function render(list){
  if(list.length===0){
    rowsEl.innerHTML="";
    emptyEl.hidden=false;
  } else {
    emptyEl.hidden=true;
    const tp=currentTerm("p"), tt=currentTerm("t"), ta=currentTerm("a");
    const html = list.map((d,i)=>(
      "<tr>"+
      "<td class='col-num'>"+(i+1)+"</td>"+
      "<td><a class='chip' style='background:"+d.color+"' href='https://www.deezer.com/nl/playlist/"+d.pid+"' target='_blank' rel='noopener' title='Open playlist in Deezer'>"+highlight(d.p,tp)+"</a></td>"+
      "<td class='t-title'><a class='tlink' href='https://www.deezer.com/nl/track/"+d.tid+"' target='_blank' rel='noopener' title='Speel af in Deezer'>"+highlight(d.t,tt)+"<span class='play'>▶</span></a></td>"+
      "<td class='t-artist'>"+highlight(d.a,ta)+"</td>"+
      "</tr>"
    )).join("");
    rowsEl.innerHTML=html;
  }
  document.getElementById("count").textContent = list.length;
  const filtered = list.length!==TOTAL;
  footEl.textContent = filtered
    ? (list.length+" van "+TOTAL+" nummers · 10 playlists (2017–2026)")
    : (TOTAL+" nummers · 10 playlists (2017–2026)");
}

// events
const globalEl = document.getElementById("global");
globalEl.addEventListener("input", e=>{ state.q=e.target.value; apply(); });

document.querySelectorAll(".colfilter").forEach(inp=>{
  inp.addEventListener("input", e=>{ state.f[e.target.dataset.col]=e.target.value; apply(); });
});

document.querySelectorAll(".th-inner").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key=th.dataset.key;
    if(state.sort===key){ state.dir*=-1; }
    else { state.sort=key; state.dir=1; }
    updateSortIndicators();
    apply();
  });
});

function updateSortIndicators(){
  document.querySelectorAll("thead th").forEach(th=>th.classList.remove("sorted"));
  document.querySelectorAll(".th-inner").forEach(el=>{
    const arrow=el.querySelector(".arrow");
    if(el.dataset.key===state.sort){
      el.closest("th").classList.add("sorted");
      arrow.textContent = state.dir===1 ? "▲" : "▼";
    } else {
      arrow.textContent="";
    }
  });
}

document.getElementById("clear").addEventListener("click", ()=>{
  state.q=""; state.f={p:"",t:"",a:""}; state.sort="n"; state.dir=1;
  globalEl.value="";
  document.querySelectorAll(".colfilter").forEach(i=>i.value="");
  updateSortIndicators();
  apply();
  globalEl.focus();
});

updateSortIndicators();
